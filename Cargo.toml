[package]
name = "ferrit"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
description = "A lazygit-style terminal UI for git, written in Rust"
authors = ["The ferrit Authors"]
license = "MIT"
repository = "https://github.com/ferrit-rs/ferrit"
homepage = "https://github.com/ferrit-rs/ferrit"
readme = "README.md"
keywords = ["git", "tui", "lazygit", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ferrit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = "0.29"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify-debouncer-full = "0.7"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
