[package]
name = "ferrit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The everyday git manager for the terminal: a full TUI for your repository, and an empty folder to GitHub without leaving it"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
exclude = ["demo-ferrit.gif", "assets/ferrit/motion-design/ferrit-film.mp4"]
keywords = ["git", "tui", "terminal", "github", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
ferrit-config.workspace = true
ferrit-domain.workspace = true
ferrit-git.workspace = true
ferrit-tui.workspace = true
clap.workspace = true
color-eyre.workspace = true
enum-map.workspace = true
image.workspace = true
notify-debouncer-full.workspace = true
ratatui.workspace = true
ratatui-core.workspace = true
ratatui-image.workspace = true
ratatui-widgets.workspace = true
strum.workspace = true
syntect.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[features]
# The test seams: the replay harness (`--replay`, `--fixture` and the other
# hidden flags) and the in-memory `FakeGit`. Off in a normal build, so a
# `cargo install ferrit` does not ship them. The integration tests turn it on
# through the dev-dependency below; to use the flags by hand, build with
# `--features test-util`.
test-util = ["ferrit-git/test-util"]

[dev-dependencies]
ferrit-app = { path = ".", features = ["test-util"] }
ferrit-git = { workspace = true, features = ["test-util"] }
git2.workspace = true
proptest.workspace = true
