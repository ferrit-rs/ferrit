name: CI

# Every gate that must stay green also runs locally; see AGENTS.md. The
# toolchain is whatever rust-toolchain.toml pins, so CI and contributors lint
# with the exact same compiler.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GIT_CONFIG_NOSYSTEM: 1

jobs:
  check:
    name: fmt / clippy / doc / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # setup-rust-toolchain reads rust-toolchain.toml on its own; naming
          # the components keeps it explicit and fails fast if the pin drops one.
          components: clippy, rustfmt, rust-src
          cache: true

      - name: Install cargo-nextest, cargo-machete, cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete,cargo-deny

      - name: Blocking quality gates
        run: ./scripts/quality.sh check

  # The declared minimum Rust version (`rust-version` in workspace package metadata, the one
  # source of truth) must build the crate. rust-toolchain.toml pins the
  # developer toolchain, so RUSTUP_TOOLCHAIN overrides it for this job.
  msrv:
    name: build on the minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain named by rust-version
        run: |
          msrv=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: cargo check with the locked dependencies
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
        run: cargo check --locked -p ferrit --all-targets

  # ferrit is used on macOS as much as on Linux: the same tests, on the macOS
  # runner (git, file watching and temp dirs all behave a little differently).
  test-macos:
    name: nextest on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: nextest
        run: FERRIT_NO_DELTA=1 cargo nextest run --all-features

  # Informational, never a gate: line coverage of the test suite, in the job
  # summary and as an lcov artifact.
  coverage:
    name: coverage (summary only)
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run the tests with coverage
        run: cargo llvm-cov nextest --all-features --lcov --output-path lcov.info

      - name: Summary
        run: |
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  # Human-facing proof, never a gate (`docs/PLAN_SELF_TESTING.md` ST5): tapes
  # generated from the same scripts the `nextest` step above already ran, and,
  # best effort, the screenshots `vhs` renders from them. A failure here does
  # not fail the workflow.
  tapes:
    name: vhs tapes and screenshots (artifacts only)
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build a debug binary, the harness flags are test-only
        run: cargo build -p ferrit --features test-util

      - name: Generate tapes from test/scripts
        run: |
          sh test/gen-tapes.sh
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: vhs-tapes
          path: test/tapes

      - name: Render a screenshot set with vhs
        continue-on-error: true
        uses: charmbracelet/vhs-action@v2
        with:
          path: test/tapes/10-layout.tape

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vhs-shots
          path: test/shots
          if-no-files-found: ignore
